<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 웹 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --calc-bg: rgba(30, 41, 59, 0.75);
      --calc-border: rgba(255, 255, 255, 0.1);
      --calc-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      --display-bg: rgba(15, 23, 42, 0.65);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-num-bg: rgba(255, 255, 255, 0.05);
      --btn-num-hover: rgba(255, 255, 255, 0.12);
      --btn-num-active: rgba(255, 255, 255, 0.2);
      --btn-op-bg: rgba(56, 189, 248, 0.15);
      --btn-op-hover: rgba(56, 189, 248, 0.25);
      --btn-op-text: #38bdf8;
      --btn-fn-bg: rgba(148, 163, 184, 0.12);
      --btn-fn-hover: rgba(148, 163, 184, 0.22);
      --btn-fn-text: #cbd5e1;
      --btn-equals-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --btn-equals-hover: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --btn-equals-text: #ffffff;
      --history-bg: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #f1f5f9 100%);
      --calc-bg: rgba(255, 255, 255, 0.85);
      --calc-border: rgba(255, 255, 255, 0.6);
      --calc-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      --display-bg: rgba(241, 245, 249, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btn-num-bg: #ffffff;
      --btn-num-hover: #f1f5f9;
      --btn-num-active: #e2e8f0;
      --btn-op-bg: rgba(2, 132, 199, 0.12);
      --btn-op-hover: rgba(2, 132, 199, 0.2);
      --btn-op-text: #0284c7;
      --btn-fn-bg: #e2e8f0;
      --btn-fn-hover: #cbd5e1;
      --btn-fn-text: #334155;
      --btn-equals-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --btn-equals-hover: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --btn-equals-text: #ffffff;
      --history-bg: rgba(255, 255, 255, 0.95);
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: var(--text-main);
      padding: 16px;
      transition: background 0.3s ease;
    }

    .calc-container {
      width: 100%;
      max-width: 380px;
      background: var(--calc-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--calc-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--calc-shadow);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Controls */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calc-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .calc-title svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--calc-border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Display Area */
    .display-screen {
      background: var(--display-bg);
      border: 1px solid var(--calc-border);
      border-radius: 20px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      min-height: 120px;
      position: relative;
      word-break: break-all;
    }

    .display-formula {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: var(--text-muted);
      min-height: 22px;
      margin-bottom: 6px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .display-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: 40px;
      font-weight: 700;
      color: var(--text-main);
      width: 100%;
      text-align: right;
      line-height: 1.1;
      letter-spacing: -1px;
      transition: font-size 0.15s ease;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 20px;
      font-weight: 500;
      border-radius: 18px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .btn:active {
      transform: scale(0.94);
    }

    /* Button Variants */
    .btn-num {
      background: var(--btn-num-bg);
      color: var(--text-main);
    }
    .btn-num:hover {
      background: var(--btn-num-hover);
    }

    .btn-fn {
      background: var(--btn-fn-bg);
      color: var(--btn-fn-text);
      font-size: 18px;
      font-weight: 600;
    }
    .btn-fn:hover {
      background: var(--btn-fn-hover);
    }

    .btn-op {
      background: var(--btn-op-bg);
      color: var(--btn-op-text);
      font-size: 24px;
      font-weight: 600;
    }
    .btn-op:hover {
      background: var(--btn-op-hover);
    }

    .btn-equals {
      background: var(--btn-equals-bg);
      color: var(--btn-equals-text);
      font-size: 26px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-equals:hover {
      background: var(--btn-equals-hover);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.5);
    }

    /* History Drawer */
    .history-drawer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--history-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .history-drawer.open {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--calc-border);
      margin-bottom: 14px;
    }

    .history-header h3 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--calc-border);
      border-radius: 4px;
    }

    .history-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      cursor: pointer;
      text-align: right;
      transition: background 0.2s ease;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-item .hist-expr {
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
    }

    .history-item .hist-res {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin: auto;
    }

    .history-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--calc-border);
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: color 0.2s ease;
    }
    .btn-text:hover {
      color: #ef4444;
    }

    /* Key press active visual */
    .btn.pressed {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <div class="calc-container" id="calculator">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="calc-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <rect width="18" height="20" x="3" y="2" rx="3"></rect>
          <line x1="8" x2="16" y1="6" y2="6"></line>
          <line x1="8" x2="8.01" y1="10" y2="10"></line>
          <line x1="12" x2="12.01" y1="10" y2="10"></line>
          <line x1="16" x2="16.01" y1="10" y2="10"></line>
          <line x1="8" x2="8.01" y1="14" y2="14"></line>
          <line x1="12" x2="12.01" y1="14" y2="14"></line>
          <line x1="16" x2="16.01" y1="14" y2="14"></line>
          <line x1="8" x2="8.01" y1="18" y2="18"></line>
          <line x1="12" x2="12.01" y1="18" y2="18"></line>
          <line x1="16" x2="16.01" y1="18" y2="18"></line>
        </svg>
        <span>계산기</span>
      </div>
      <div class="top-actions">
        <!-- Audio Sound Toggle -->
        <button class="icon-btn" id="btnSound" title="소리 켜기/끄기" aria-label="사운드 토글">
          <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <!-- History Toggle -->
        <button class="icon-btn" id="btnHistory" title="기록 보기" aria-label="계산 기록">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <!-- Theme Toggle -->
        <button class="icon-btn" id="btnTheme" title="테마 전환" aria-label="테마 전환">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Display Screen -->
    <div class="display-screen">
      <div class="display-formula" id="formulaDisplay">&nbsp;</div>
      <div class="display-main" id="mainDisplay">0</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn btn-fn" data-action="clear" data-key="Escape">AC</button>
      <button class="btn btn-fn" data-action="delete" data-key="Backspace">⌫</button>
      <button class="btn btn-fn" data-action="percent" data-key="%">%</button>
      <button class="btn btn-op" data-action="operator" data-val="÷" data-key="/">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-num" data-action="number" data-val="7" data-key="7">7</button>
      <button class="btn btn-num" data-action="number" data-val="8" data-key="8">8</button>
      <button class="btn btn-num" data-action="number" data-val="9" data-key="9">9</button>
      <button class="btn btn-op" data-action="operator" data-val="×" data-key="*">×</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-action="number" data-val="4" data-key="4">4</button>
      <button class="btn btn-num" data-action="number" data-val="5" data-key="5">5</button>
      <button class="btn btn-num" data-action="number" data-val="6" data-key="6">6</button>
      <button class="btn btn-op" data-action="operator" data-val="-" data-key="-">−</button>

      <!-- Row 4 -->
      <button class="btn btn-num" data-action="number" data-val="1" data-key="1">1</button>
      <button class="btn btn-num" data-action="number" data-val="2" data-key="2">2</button>
      <button class="btn btn-num" data-action="number" data-val="3" data-key="3">3</button>
      <button class="btn btn-op" data-action="operator" data-val="+" data-key="+">+</button>

      <!-- Row 5 -->
      <button class="btn btn-fn" data-action="negate">±</button>
      <button class="btn btn-num" data-action="number" data-val="0" data-key="0">0</button>
      <button class="btn btn-num" data-action="decimal" data-val="." data-key=".">.</button>
      <button class="btn btn-equals" data-action="calculate" data-key="Enter">=</button>
    </div>

    <!-- History Drawer -->
    <div class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <h3>계산 기록</h3>
        <button class="icon-btn" id="btnCloseHistory" title="닫기">✕</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">기록된 계산 내역이 없습니다.</div>
      </div>
      <div class="history-actions">
        <button class="btn-text" id="btnClearHistory">기록 지우기</button>
      </div>
    </div>
  </div>

  <script>
    // State Management
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let shouldResetInput = false;
    let history = [];
    let isSoundOn = true;

    // Web Audio Click Synthesizer
    let audioCtx = null;
    function playClickSound(freq = 600, duration = 0.03) {
      if (!isSoundOn) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // AudioContext not supported or blocked
      }
    }

    // DOM Elements
    const mainDisplay = document.getElementById('mainDisplay');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    const btnHistory = document.getElementById('btnHistory');
    const btnCloseHistory = document.getElementById('btnCloseHistory');
    const btnClearHistory = document.getElementById('btnClearHistory');
    const btnTheme = document.getElementById('btnTheme');
    const btnSound = document.getElementById('btnSound');
    const themeIcon = document.getElementById('themeIcon');
    const soundOnIcon = document.getElementById('soundOnIcon');

    // Number Formatting
    function formatNumber(numStr) {
      if (numStr === 'Error' || numStr === '오류') return numStr;
      const parts = numStr.split('.');
      const integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';
      
      const formattedInteger = Number(integerPart).toLocaleString('ko-KR');
      return isNaN(Number(integerPart)) ? numStr : formattedInteger + decimalPart;
    }

    // Adjust font size based on text length
    function adjustFontSize() {
      const length = currentInput.length;
      if (length > 14) {
        mainDisplay.style.fontSize = '24px';
      } else if (length > 10) {
        mainDisplay.style.fontSize = '30px';
      } else if (length > 7) {
        mainDisplay.style.fontSize = '34px';
      } else {
        mainDisplay.style.fontSize = '40px';
      }
    }

    function updateDisplay() {
      mainDisplay.textContent = formatNumber(currentInput);
      adjustFontSize();

      if (operation && previousInput !== '') {
        formulaDisplay.textContent = `${formatNumber(previousInput)} ${operation}`;
      } else {
        formulaDisplay.innerHTML = '&nbsp;';
      }
    }

    // Safe Accurate Arithmetic to avoid 0.1 + 0.2 floating point issues
    function roundAccurate(num, precision = 12) {
      return parseFloat(Number(num.toPrecision(precision)).toString());
    }

    function calculateResult(a, b, op) {
      const numA = parseFloat(a);
      const numB = parseFloat(b);
      if (isNaN(numA) || isNaN(numB)) return 0;

      switch (op) {
        case '+':
          return roundAccurate(numA + numB);
        case '-':
          return roundAccurate(numA - numB);
        case '×':
          return roundAccurate(numA * numB);
        case '÷':
          if (numB === 0) return 'Error';
          return roundAccurate(numA / numB);
        default:
          return numB;
      }
    }

    // Input handlers
    function inputDigit(digit) {
      playClickSound(520);
      if (currentInput === '0' || shouldResetInput || currentInput === 'Error') {
        currentInput = digit;
        shouldResetInput = false;
      } else {
        if (currentInput.length >= 16) return; // Prevent overflow
        currentInput += digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      playClickSound(600);
      if (shouldResetInput || currentInput === 'Error') {
        currentInput = '0.';
        shouldResetInput = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function handleOperator(nextOp) {
      playClickSound(700);
      if (currentInput === 'Error') clearAll();

      if (operation && !shouldResetInput) {
        const result = calculateResult(previousInput, currentInput, operation);
        if (result === 'Error') {
          currentInput = 'Error';
          operation = null;
          previousInput = '';
          updateDisplay();
          return;
        }
        currentInput = String(result);
        previousInput = String(result);
      } else {
        previousInput = currentInput;
      }

      operation = nextOp;
      shouldResetInput = true;
      updateDisplay();
    }

    function executeCalculation() {
      playClickSound(850, 0.05);
      if (!operation || previousInput === '' || shouldResetInput) return;

      const exprStr = `${formatNumber(previousInput)} ${operation} ${formatNumber(currentInput)}`;
      const result = calculateResult(previousInput, currentInput, operation);

      if (result === 'Error') {
        currentInput = '오류';
        formulaDisplay.textContent = `${exprStr} =`;
        operation = null;
        previousInput = '';
        shouldResetInput = true;
        updateDisplay();
        return;
      }

      const finalResultStr = String(result);
      formulaDisplay.textContent = `${exprStr} =`;
      
      // Save history
      addHistory(exprStr, formatNumber(finalResultStr), finalResultStr);

      currentInput = finalResultStr;
      operation = null;
      previousInput = '';
      shouldResetInput = true;
      updateDisplay();
    }

    function clearAll() {
      playClickSound(400);
      currentInput = '0';
      previousInput = '';
      operation = null;
      shouldResetInput = false;
      updateDisplay();
    }

    function deleteLastChar() {
      playClickSound(450);
      if (shouldResetInput || currentInput === 'Error' || currentInput === '오류') {
        clearAll();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      playClickSound(550);
      if (currentInput === '0' || currentInput === 'Error' || currentInput === '오류') return;
      currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
      updateDisplay();
    }

    function applyPercent() {
      playClickSound(650);
      if (currentInput === 'Error' || currentInput === '오류') return;
      const num = parseFloat(currentInput);
      if (!isNaN(num)) {
        currentInput = String(roundAccurate(num / 100));
        updateDisplay();
      }
    }

    // History Handling
    function addHistory(expr, formattedRes, rawRes) {
      history.unshift({ expr, formattedRes, rawRes });
      if (history.length > 20) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">기록된 계산 내역이 없습니다.</div>';
        return;
      }

      historyList.innerHTML = history.map((item, idx) => `
        <div class="history-item" data-index="${idx}">
          <div class="hist-expr">${item.expr} =</div>
          <div class="hist-res">${item.formattedRes}</div>
        </div>
      `).join('');

      // Add click to restore
      historyList.querySelectorAll('.history-item').forEach(itemEl => {
        itemEl.addEventListener('click', () => {
          const idx = itemEl.getAttribute('data-index');
          currentInput = history[idx].rawRes;
          shouldResetInput = true;
          updateDisplay();
          historyDrawer.classList.remove('open');
        });
      });
    }

    // History Toggle
    btnHistory.addEventListener('click', () => {
      historyDrawer.classList.add('open');
    });
    btnCloseHistory.addEventListener('click', () => {
      historyDrawer.classList.remove('open');
    });
    btnClearHistory.addEventListener('click', () => {
      history = [];
      renderHistory();
    });

    // Theme Switch
    btnTheme.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', nextTheme);
      
      if (nextTheme === 'light') {
        themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      } else {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        `;
      }
    });

    // Sound Switch
    btnSound.addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        btnSound.style.opacity = '1';
        soundOnIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        `;
      } else {
        btnSound.style.opacity = '0.5';
        soundOnIcon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        `;
      }
    });

    // Keypad Click Event Dispatcher
    document.querySelector('.keypad').addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn) return;

      const action = btn.dataset.action;
      const val = btn.dataset.val;

      switch (action) {
        case 'number':
          inputDigit(val);
          break;
        case 'decimal':
          inputDecimal();
          break;
        case 'operator':
          handleOperator(val);
          break;
        case 'calculate':
          executeCalculation();
          break;
        case 'clear':
          clearAll();
          break;
        case 'delete':
          deleteLastChar();
          break;
        case 'negate':
          toggleSign();
          break;
        case 'percent':
          applyPercent();
          break;
      }
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      let key = e.key;

      if (key >= '0' && key <= '9') {
        inputDigit(key);
        highlightButton(key);
      } else if (key === '.') {
        inputDecimal();
        highlightButton('.');
      } else if (key === '+' || key === '-') {
        handleOperator(key === '-' ? '-' : '+');
        highlightButton(key);
      } else if (key === '*') {
        handleOperator('×');
        highlightButton('*');
      } else if (key === '/') {
        e.preventDefault();
        handleOperator('÷');
        highlightButton('/');
      } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        executeCalculation();
        highlightButton('Enter');
      } else if (key === 'Backspace') {
        deleteLastChar();
        highlightButton('Backspace');
      } else if (key === 'Escape') {
        clearAll();
        highlightButton('Escape');
      } else if (key === '%') {
        applyPercent();
        highlightButton('%');
      }
    });

    function highlightButton(key) {
      const btn = document.querySelector(`.btn[data-key="${key}"]`);
      if (btn) {
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 120);
      }
    }

    // Initial render
    updateDisplay();
  </script>
</body>
</html>
